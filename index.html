<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Showroom Catalogue</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --line:#e1e6f0; --ink:#1b2438; --muted:#667089;
  --brand:#1e4fd8; --brand-soft:#e8eefc; --gold:#1e4fd8; --red:#d93a55; --green:#168a4a; --wa:#25d366;
  --r:14px; --shadow:0 1px 3px rgba(20,30,60,.08);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600;transition:.15s}
button:hover{background:#173fb0}
button:active{transform:scale(.97)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--brand);background:var(--brand-soft)}
button.wa{background:var(--wa);color:#052e14}
button.wa:hover{background:#1fb956}
button.danger{background:#fff;color:var(--red);border:1px solid #f1c3cc}
button.danger:hover{background:#fdeef1}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#9aa4bd}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:12px 0 5px}

/* hero */
.hero{max-width:1100px;margin:auto;padding:20px 16px 0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--brand-soft)}
.logo h1{font-size:1.3rem;line-height:1.1}
.logo small{color:var(--muted)}
.icon-btn{background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px 14px}
.icon-btn:hover{background:var(--brand-soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.45rem;color:var(--brand)}
.stat span{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}

.wrap{max-width:1100px;margin:16px auto 110px;padding:0 16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:8px;z-index:4}
.tools input{flex:1;min-width:150px}
.tools select{width:auto}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);margin:0;white-space:nowrap;cursor:pointer}
.toggle input{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}
.chip{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:500}
.chip:hover{background:var(--brand-soft)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.count{color:var(--muted);font-size:.85rem;margin:8px 2px;display:flex;justify-content:space-between;align-items:center}
.link-btn{background:none;color:var(--brand);padding:4px 8px;font-size:.85rem}
.link-btn:hover{background:var(--brand-soft)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:8px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pcard:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px rgba(30,79,216,.12)}
.pimg{aspect-ratio:4/3;background:#eaeffb;display:grid;place-items:center;font-size:3.2rem;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;transition:.35s}
.pcard:hover .pimg img{transform:scale(1.05)}
.pbody{padding:12px 14px 14px}
.pbody .brand{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pbody h3{font-size:1rem;font-weight:600;margin:3px 0 9px;line-height:1.3;min-height:2.6em}
.price{font-size:1.2rem;color:var(--brand);font-weight:700}
.mrp{color:var(--muted);text-decoration:line-through;font-size:.85rem;margin-left:6px;font-weight:400}
.badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;z-index:1}
.star{position:absolute;top:8px;right:8px;z-index:1;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:.85rem;line-height:1}
.oos{position:absolute;bottom:10px;left:10px;background:#222;color:#fff;font-size:.72rem;padding:4px 9px;border-radius:99px;z-index:1}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;padding:7px;font-size:.8rem}
.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1}
.empty .big{font-size:3.2rem}
.empty h3{color:var(--ink)}
.empty button{margin-top:14px}

.fab{position:fixed;right:18px;bottom:18px;z-index:6;border-radius:99px;padding:14px 24px;font-size:1rem;box-shadow:0 4px 14px rgba(30,79,216,.35)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;width:min(540px,94vw);max-height:92vh;box-shadow:0 20px 50px rgba(20,30,60,.3);overflow:auto;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(20,30,60,.45)}
.dlg{padding:20px}
.dlg h2{margin-bottom:4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions>*{flex:1;min-width:110px}
.photo-pick{border:2px dashed #c5cfe6;border-radius:12px;aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted);cursor:pointer;overflow:hidden;background:#f8faff}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.detail-img{aspect-ratio:4/3;background:#eaeffb;display:grid;place-items:center;font-size:5rem}
.detail-img img{width:100%;height:100%;object-fit:cover}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{background:var(--brand-soft);color:var(--brand);padding:4px 11px;border-radius:99px;font-size:.78rem;font-weight:500}
.pill.g{background:#e3f6ec;color:var(--green)}
.pill.r{background:#fdeaee;color:var(--red)}
.feat{list-style:none;padding:0;margin:10px 0}
.feat li{padding:8px 0 8px 28px;position:relative;border-bottom:1px solid var(--line)}
.feat li:before{content:"✔";position:absolute;left:0;color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1b2438;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%)}

/* customer view */
.viewer{max-width:460px;margin:0 auto;padding:18px}
.viewer .shop{text-align:center;color:var(--brand);font-weight:700;margin:6px 0 14px;font-size:1.2rem}
.viewer .box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.viewer .in{padding:18px}
.viewer .note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:14px}
.hide{display:none!important}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.pbody h3{font-size:.9rem}.price{font-size:1.05rem}.quick{display:none}}
</style>
</head>
<body>

<!-- ============ MANAGER ============ -->
<div id="manager">
  <div class="hero">
    <div class="nav">
      <div class="logo"><div class="mark">🏠</div><div><h1 id="shopTitle">My Showroom</h1><small id="shopSub">Product catalogue</small></div></div>
      <button class="icon-btn" id="btnSettings">⚙️ Settings</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>Products</span></div>
      <div class="stat"><b id="stStock">0</b><span>In stock</span></div>
      <div class="stat"><b id="stCats">0</b><span>Categories</span></div>
      <div class="stat"><b id="stAvg">₹0</b><span>Avg. price</span></div>
    </div>
  </div>

  <div class="wrap">
    <div class="tools">
      <input id="search" placeholder="🔍 Search name, brand, model…">
      <select id="sort">
        <option value="new">Newest</option>
        <option value="low">Price ↑</option>
        <option value="high">Price ↓</option>
        <option value="disc">Best discount</option>
      </select>
      <label class="toggle"><input type="checkbox" id="onlyStock"> In stock</label>
      <label class="toggle"><input type="checkbox" id="onlyStar"> ⭐ Featured</label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count"><span id="countTxt"></span><button class="link-btn" id="btnShareAll">📤 Share this list on WhatsApp</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <button class="fab" id="btnAdd">＋ Add Product</button>
</div>

<!-- ============ CUSTOMER VIEW ============ -->
<div id="viewer" class="viewer hide"></div>

<dialog id="dlgView"><div id="viewBody"></div></dialog>

<dialog id="dlgEdit">
  <form class="dlg" id="form" method="dialog">
    <h2 id="editTitle">Add product</h2>
    <label>Photo</label>
    <div class="photo-pick" id="photoPick">📷 Tap to add photo</div>
    <input type="file" id="file" accept="image/*" class="hide">
    <label>Product name *</label>
    <input id="fName" required placeholder="e.g. 1.5 Ton 5 Star Split AC">
    <div class="row">
      <div><label>Brand</label><input id="fBrand" placeholder="LG, Samsung…"></div>
      <div><label>Model no.</label><input id="fModel" placeholder="optional"></div>
    </div>
    <div class="row">
      <div><label>Category</label><select id="fCat"></select></div>
      <div><label>Warranty</label><input id="fWarranty" placeholder="e.g. 2 years"></div>
    </div>
    <div class="row">
      <div><label>Offer price (₹) *</label><input id="fPrice" type="number" min="0" required inputmode="numeric"></div>
      <div><label>MRP (₹)</label><input id="fMrp" type="number" min="0" inputmode="numeric"></div>
    </div>
    <label>Features (one per line)</label>
    <textarea id="fDetails" rows="5" placeholder="Inverter compressor&#10;Free installation&#10;Easy EMI available"></textarea>
    <div class="row" style="margin-top:12px">
      <label class="toggle" style="color:var(--ink)"><input type="checkbox" id="fStock" checked> In stock</label>
      <label class="toggle" style="color:var(--ink)"><input type="checkbox" id="fStar"> ⭐ Featured</label>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="btnCancel">Cancel</button>
      <button type="submit">Save product</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSet">
  <div class="dlg">
    <h2>Showroom settings</h2>
    <label>Showroom name</label><input id="sName" placeholder="Sri Lakshmi Home Appliances">
    <label>Tagline</label><input id="sTag" placeholder="Best prices • Free delivery • Easy EMI">
    <label>WhatsApp number (customers chat here)</label><input id="sPhone" placeholder="98765 43210" inputmode="tel">
    <label>Address (shown on shared links)</label><input id="sAddr" placeholder="Main Road, Your City">
    <div class="actions">
      <button class="ghost" id="btnExport">⬇ Backup</button>
      <button class="ghost" id="btnImport">⬆ Restore</button>
      <input type="file" id="impFile" accept=".json" class="hide">
    </div>
    <div class="actions">
      <button class="ghost" id="setClose">Close</button>
      <button id="setSave">Save</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CATS = [['📺','TV'],['🧊','Fridge'],['🧺','Washing Machine'],['❄️','AC'],['🍳','Kitchen'],['🔌','Small Appliances'],['🏠','Other']];
const icon = c => (CATS.find(x => x[1] === c) || ['🏠'])[0];
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const off = p => p.mrp > p.price ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
const feats = p => (p.details || '').split('\n').map(s => s.trim()).filter(Boolean);

/* ---------- storage ---------- */
let db = JSON.parse(localStorage.getItem('catalogue') || 'null') || { shop: { name: '', tag: '', phone: '', addr: '' }, items: [] };
const save = () => { try { localStorage.setItem('catalogue', JSON.stringify(db)); } catch { toast('Storage full! Delete a few items.'); } };
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2400); }

/* ---------- list ---------- */
let curCat = 'All';
function renderChips() {
  const all = ['All', ...CATS.map(c => c[1])];
  $('#chips').innerHTML = all.map(c => {
    const n = c === 'All' ? db.items.length : db.items.filter(p => p.cat === c).length;
    return `<button class="chip ${c === curCat ? 'on' : ''}" data-c="${c}">${c === 'All' ? '✨' : icon(c)} ${c} · ${n}</button>`;
  }).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { curCat = b.dataset.c; renderChips(); renderGrid(); });
}
function renderStats() {
  const it = db.items;
  $('#stTotal').textContent = it.length;
  $('#stStock').textContent = it.filter(p => p.stock !== false).length;
  $('#stCats').textContent = new Set(it.map(p => p.cat)).size;
  $('#stAvg').textContent = it.length ? inr(Math.round(it.reduce((a, p) => a + p.price, 0) / it.length)) : '₹0';
  $('#shopTitle').textContent = db.shop.name || 'My Showroom';
  $('#shopSub').textContent = db.shop.tag || 'Product catalogue';
}
function filtered() {
  const q = $('#search').value.toLowerCase().trim(), s = $('#sort').value;
  let list = db.items.filter(p => (curCat === 'All' || p.cat === curCat) &&
    (p.name + ' ' + p.brand + ' ' + (p.model || '')).toLowerCase().includes(q) &&
    (!$('#onlyStock').checked || p.stock !== false) && (!$('#onlyStar').checked || p.star));
  if (s === 'low') list.sort((a, b) => a.price - b.price);
  else if (s === 'high') list.sort((a, b) => b.price - a.price);
  else if (s === 'disc') list.sort((a, b) => off(b) - off(a));
  else list.sort((a, b) => (b.star ? 1 : 0) - (a.star ? 1 : 0) || b.id - a.id);
  return list;
}
function renderGrid() {
  renderStats();
  const list = filtered();
  $('#countTxt').textContent = list.length + (list.length === 1 ? ' product' : ' products');
  $('#btnShareAll').classList.toggle('hide', !list.length);
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty"><div class="big">🛋️</div><h3>${db.items.length ? 'Nothing found' : 'Your catalogue is empty'}</h3><p>${db.items.length ? 'Try another search or category.' : 'Tap “＋ Add Product” to add your first item.'}</p>${db.items.length ? '' : '<button id="btnDemo">✨ Load 3 sample products</button>'}</div>`;
    const d = $('#btnDemo'); if (d) d.onclick = loadDemo;
    return;
  }
  $('#grid').innerHTML = list.map((p, i) => `
    <div class="pcard" data-id="${p.id}" style="animation-delay:${Math.min(i, 12) * 40}ms">
      ${off(p) ? `<span class="badge">${off(p)}% OFF</span>` : ''}
      ${p.star ? `<span class="star">⭐</span>` : ''}
      ${p.stock === false ? `<span class="oos">Out of stock</span>` : ''}
      <div class="pimg">${p.img ? `<img src="${p.img}" alt="">` : icon(p.cat)}</div>
      <div class="pbody">
        <div class="brand">${esc(p.brand) || '&nbsp;'}</div>
        <h3>${esc(p.name)}</h3>
        <span class="price">${inr(p.price)}</span>${p.mrp > p.price ? `<span class="mrp">${inr(p.mrp)}</span>` : ''}
        <div class="quick"><button class="wa" data-q="${p.id}">WhatsApp</button><button class="ghost" data-s="${p.id}">⭐</button></div>
      </div>
    </div>`).join('');
  $('#grid').querySelectorAll('.pcard').forEach(c => c.onclick = () => openView(+c.dataset.id));
  $('#grid').querySelectorAll('[data-q]').forEach(b => b.onclick = e => { e.stopPropagation(); shareLink(db.items.find(p => p.id === +b.dataset.q)); });
  $('#grid').querySelectorAll('[data-s]').forEach(b => b.onclick = e => { e.stopPropagation(); const p = db.items.find(p => p.id === +b.dataset.s); p.star = !p.star; save(); renderGrid(); });
}
['#search', '#sort', '#onlyStock', '#onlyStar'].forEach(s => { $(s).oninput = renderGrid; $(s).onchange = renderGrid; });

function loadDemo() {
  const t = Date.now();
  db.items.push(
    { id: t + 1, name: '1.5 Ton 5 Star Inverter Split AC', brand: 'Voltas', model: '185V', cat: 'AC', price: 32990, mrp: 52990, warranty: '5 yr compressor', details: 'Copper condenser\nTurbo cooling\nFree standard installation', stock: true, star: true, img: '' },
    { id: t + 2, name: '55" 4K Ultra HD Smart LED TV', brand: 'Samsung', model: 'UA55', cat: 'TV', price: 41990, mrp: 64900, warranty: '1 yr + 1 yr panel', details: 'Google TV\nDolby Audio\nEMI from ₹1,999/mo', stock: true, star: false, img: '' },
    { id: t + 3, name: '7 kg Front Load Washing Machine', brand: 'LG', model: 'FHB1207', cat: 'Washing Machine', price: 27490, mrp: 38990, warranty: '2 yr + 10 yr motor', details: 'AI Direct Drive\nSteam wash\nInverter motor', stock: false, star: false, img: '' });
  save(); renderChips(); renderGrid(); toast('Samples added — edit or delete freely');
}

/* ---------- detail ---------- */
function openView(id) {
  const p = db.items.find(x => x.id === id); if (!p) return;
  $('#viewBody').innerHTML = `
    <div class="detail-img">${p.img ? `<img src="${p.img}">` : icon(p.cat)}</div>
    <div class="dlg">
      <div style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em">${esc(p.brand)} ${p.model ? '· ' + esc(p.model) : ''}</div>
      <h2>${esc(p.name)}</h2>
      <div><span class="price" style="font-size:1.8rem">${inr(p.price)}</span>${p.mrp > p.price ? `<span class="mrp">${inr(p.mrp)}</span> <b style="color:var(--red)">${off(p)}% off</b>` : ''}</div>
      <div class="pills">
        <span class="pill">${icon(p.cat)} ${esc(p.cat)}</span>
        ${p.warranty ? `<span class="pill">🛡 ${esc(p.warranty)}</span>` : ''}
        <span class="pill ${p.stock === false ? 'r' : 'g'}">${p.stock === false ? 'Out of stock' : 'In stock'}</span>
      </div>
      <ul class="feat">${feats(p).map(f => `<li>${esc(f)}</li>`).join('')}</ul>
      <div class="actions">
        <button class="wa" id="shImg">📸 Share card (photo)</button>
        <button class="wa" id="shLink">🔗 Share link</button>
      </div>
      <div class="actions">
        <button class="ghost" id="vEdit">✏️ Edit</button>
        <button class="ghost" id="vDup">⧉ Duplicate</button>
        <button class="danger" id="vDel">🗑 Delete</button>
        <button class="ghost" id="vClose">Close</button>
      </div>
    </div>`;
  $('#dlgView').showModal();
  $('#vClose').onclick = () => $('#dlgView').close();
  $('#vEdit').onclick = () => { $('#dlgView').close(); openEdit(id); };
  $('#vDup').onclick = () => { db.items.unshift({ ...p, id: Date.now(), name: p.name + ' (copy)' }); save(); $('#dlgView').close(); renderChips(); renderGrid(); toast('Duplicated — edit the copy'); };
  $('#vDel').onclick = () => { if (confirm('Delete this product?')) { db.items = db.items.filter(x => x.id !== id); save(); $('#dlgView').close(); renderChips(); renderGrid(); toast('Deleted'); } };
  $('#shLink').onclick = () => shareLink(p);
  $('#shImg').onclick = () => shareCard(p);
}

/* ---------- add / edit ---------- */
let editId = null, photo = '';
CATS.forEach(c => $('#fCat').insertAdjacentHTML('beforeend', `<option>${c[1]}</option>`));
function setPhoto(src) { photo = src; $('
