<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#131921">
<title>Showroom Catalogue</title>
<style>
:root{
  --nav:#131921; --nav2:#232f3e; --orange:#febd69; --yellow:#ffd814; --yellow-b:#fcd200; --amber:#ffa41c; --amber-b:#ff8f00;
  --link:#007185; --linkh:#c7511f; --red:#cc0c39; --green:#007600; --ink:#0f1111; --muted:#565959; --bd:#d5d9d9; --bg:#eaeded;
}
*{box-sizing:border-box;margin:0}
body{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
h2{font-size:22px;font-weight:600;line-height:1.3}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
.muted{color:var(--muted)}
.lk{color:var(--link)}

button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--yellow-b);border-radius:99px;padding:8px 16px;background:var(--yellow);color:var(--ink);transition:background .15s}
button:hover{background:#f7ca00}
button:active{transform:scale(.98)}
button.alt{background:var(--amber);border-color:var(--amber-b)}
button.alt:hover{background:#fa8900}
button.ghost{background:#fff;border-color:var(--bd)}
button.ghost:hover{background:#f7fafa}
button.danger{background:#fff;border-color:var(--bd);color:#b12704}
button.link{background:none;border:0;color:var(--link);padding:2px 0;border-radius:0}
button.link:hover{color:var(--linkh);text-decoration:underline;background:none}

input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid #a6a6a6;border-top-color:#949494;border-radius:3px;background:#fff;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#8d9096}
input:focus,select:focus,textarea:focus{outline:none;border-color:#e77600;box-shadow:0 0 3px 2px rgba(228,121,17,.5)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:7px;font-weight:400;margin:6px 0;cursor:pointer}
.chk input{width:auto}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}

/* header */
.top{background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.brandbox{padding:4px 8px;border:1px solid transparent;border-radius:3px;min-width:0}
.brandbox:hover{border-color:#fff}
.brandbox b{font-size:20px;display:block;line-height:1.15}
.brandbox small{color:var(--orange);font-size:11px}
.search{flex:1;display:flex;min-width:260px;border-radius:6px;overflow:hidden;order:2}
.search select{width:auto;max-width:120px;border:0;border-radius:0;background:#f3f3f3;color:#555;padding:0 8px;font-size:12px;border-right:1px solid #cdcdcd}
.search input{border:0;border-radius:0;padding:11px 12px;font-size:15px}
.search input:focus,.search select:focus{box-shadow:none}
.search:focus-within{box-shadow:0 0 0 3px var(--orange)}
.search button{border:0;border-radius:0;background:var(--orange);color:var(--ink);padding:0 18px;font-size:18px}
.search button:hover{background:#f3a847}
.tools{display:flex;gap:8px;order:3}
.sub{background:var(--nav2);display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.sub button{background:none;border:1px solid transparent;border-radius:3px;color:#fff;padding:9px 10px;white-space:nowrap;font-size:13px}
.sub button:hover{border-color:#fff;background:none}
.sub button.on{border-color:#fff;font-weight:700}

/* layout */
.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:14px}
.side{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 14px 14px;align-self:start;position:sticky;top:10px}
.side h4{font-size:14px;margin:14px 0 4px}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.rbar .r{display:flex;align-items:center;gap:10px}
.rbar select{width:auto;font-size:13px;padding:6px 8px;background:#f0f2f2;border-color:#d5d9d9;border-radius:8px}
.rbar label{margin:0;font-weight:400;font-size:13px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 2px 10px rgba(15,17,17,.25)}
.pimg{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;font-size:3.6rem;padding:10px}
.pimg.ph{background:#f7f7f7}
.pimg img{width:100%;height:100%;object-fit:contain}
.pbody{padding:6px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ttl{font-size:15px;line-height:1.3;max-height:3.9em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pcard:hover .ttl{color:var(--linkh)}
.bm{font-size:12px;color:var(--muted)}
.price{color:var(--ink)}
.price .sym{font-size:13px;position:relative;top:-6px;margin-right:1px}
.price .whole{font-size:24px}
.price.big .whole{font-size:30px}
.price.big .sym{font-size:16px;top:-9px}
.mrp{color:var(--muted);font-size:12px}
.mrp s{color:var(--muted)}
.off{color:var(--red)}
.stock{font-size:13px}.in{color:var(--green)}.out{color:var(--muted)}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:1}
.deal{background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:2px}
.best{background:#e47911;color:#fff;font-size:12px;font-weight:700;padding:3px 7px;border-radius:2px}
.cact{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:10px}
.cact button:first-child{flex:1}
.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1;background:#fff;border:1px solid var(--bd);border-radius:8px}
.empty .big{font-size:3.2rem}
.empty h3{color:var(--ink);margin:6px 0}
.empty button{margin-top:14px}

/* dialogs */
dialog{border:0;border-radius:8px;padding:0;width:min(900px,96vw);max-height:92vh;box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:auto;background:#fff;color:var(--ink)}
dialog.narrow{width:min(520px,94vw)}
dialog::backdrop{background:rgba(15,17,17,.6)}
.dlg{padding:18px 20px}
.dlg h2{margin-bottom:4px}
.dlg .hd{background:var(--nav);color:#fff;margin:-18px -20px 14px;padding:12px 20px;font-size:17px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions>*{flex:1;min-width:110px}
.photo-pick{border:2px dashed #bbb;border-radius:8px;aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted);cursor:pointer;overflow:hidden;background:#fafafa}
.photo-pick img{width:100%;height:100%;object-fit:contain}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);position:relative}
.pd .img{background:#fff;display:grid;place-items:center;aspect-ratio:1/1;font-size:6rem;border-right:1px solid var(--bd);padding:14px}
.pd .img img{width:100%;height:100%;object-fit:contain}
.pd .info{padding:20px}
.x{position:absolute;top:8px;right:8px;z-index:2;background:#fff;border:1px solid var(--bd);border-radius:50%;width:32px;height:32px;padding:0;font-size:14px}
.feat{margin:8px 0 8px 18px}
.feat li{margin:5px 0;line-height:1.4}
.about{font-size:16px;font-weight:700;margin-top:4px}
.buy{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.buy button{flex:1;min-width:130px;padding:10px 14px}
.mng{display:flex;gap:14px;margin-top:14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--nav2);color:#fff;padding:11px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}

/* customer view */
.cv .top{justify-content:center}
.viewer{max-width:860px;margin:14px auto;padding:0 12px}
.viewer .box{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.viewer .note{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}
.hide{display:none!important}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;padding:10px}
  .side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .side>:last-child{grid-column:1/-1}
  .pd{grid-template-columns:1fr}
  .pd .img{border-right:0;border-bottom:1px solid var(--bd);aspect-ratio:4/3}
}
@media(max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .price .whole{font-size:20px}
  .ttl{font-size:13px}
  .cact{flex-direction:column;align-items:stretch;gap:4px}
  .cact button.link{text-align:center}
  .tools{order:2;margin-left:auto}
  .search{order:3;flex-basis:100%}
}
</style>
</head>
<body>

<!-- ============ MANAGER ============ -->
<div id="manager">
  <header class="top">
    <div class="brandbox"><b id="shopTitle">My Showroom</b><small id="shopSub">Product catalogue</small></div>
    <div class="search">
      <select id="catSel" aria-label="Category"></select>
      <input id="search" placeholder="Search products, brands, models">
      <button id="goSearch" aria-label="Search">🔍</button>
    </div>
    <div class="tools">
      <button class="alt" id="btnAdd">＋ Add product</button>
      <button class="ghost" id="btnSettings">⚙ Settings</button>
    </div>
  </header>
  <nav class="sub" id="chips"></nav>

  <div class="layout">
    <aside class="side">
      <div>
        <h4>Availability</h4>
        <label class="chk"><input type="checkbox" id="onlyStock"> In stock only</label>
        <h4>Deals</h4>
        <label class="chk"><input type="checkbox" id="onlyStar"> Best sellers</label>
      </div>
      <div>
        <h4>Discount</h4>
        <label class="chk"><input type="radio" name="disc" value="0" checked> All</label>
        <label class="chk"><input type="radio" name="disc" value="10"> 10% off or more</label>
        <label class="chk"><input type="radio" name="disc" value="25"> 25% off or more</label>
        <label class="chk"><input type="radio" name="disc" value="40"> 40% off or more</label>
      </div>
      <div>
        <h4>Price (₹)</h4>
        <div class="row"><input id="pmin" type="number" min="0" placeholder="Min" inputmode="numeric"><input id="pmax" type="number" min="0" placeholder="Max" inputmode="numeric"></div>
        <button class="link" id="clearF" style="margin-top:10px">Clear all filters</button>
      </div>
    </aside>

    <main id="results">
      <div class="rbar">
        <b id="countTxt"></b>
        <div class="r">
          <button class="link" id="btnShareAll">📤 Share list on WhatsApp</button>
          <label for="sort">Sort by:</label>
          <select id="sort">
            <option value="new">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="disc">Biggest discount</option>
            <option value="recent">Newest arrivals</option>
          </select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<!-- ============ CUSTOMER VIEW ============ -->
<div id="viewer" class="cv hide"></div>

<dialog id="dlgView"><div id="viewBody"></div></dialog>

<dialog id="dlgEdit" class="narrow">
  <form class="dlg" id="form" method="dialog">
    <div class="hd" id="editTitle">Add product</div>
    <label>Photo</label>
    <div class="photo-pick" id="photoPick">📷 Tap to add photo</div>
    <input type="file" id="file" accept="image/*" class="hide">
    <label>Product name *</label>
    <input id="fName" required placeholder="e.g. 1.5 Ton 5 Star Split AC">
    <div class="row">
      <div><label>Brand</label><input id="fBrand" placeholder="LG, Samsung…"></div>
      <div><label>Model no.</label><input id="fModel" placeholder="optional"></div>
    </div>
    <div class="row">
      <div><label>Category</label><select id="fCat"></select></div>
      <div><label>Warranty</label><input id="fWarranty" placeholder="e.g. 2 years"></div>
    </div>
    <div class="row">
      <div><label>Offer price (₹) *</label><input id="fPrice" type="number" min="0" required inputmode="numeric"></div>
      <div><label>M.R.P. (₹)</label><input id="fMrp" type="number" min="0" inputmode="numeric"></div>
    </div>
    <label>About this item (one point per line)</label>
    <textarea id="fDetails" rows="5" placeholder="Inverter compressor&#10;Free installation&#10;Easy EMI available"></textarea>
    <label class="chk"><input type="checkbox" id="fStock" checked> In stock</label>
    <label class="chk"><input type="checkbox" id="fStar"> Best seller (show on top)</label>
    <div class="actions">
      <button type="button" class="ghost" id="btnCancel">Cancel</button>
      <button type="submit">Save product</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSet" class="narrow">
  <div class="dlg">
    <div class="hd">Showroom settings</div>
    <label>Showroom name</label><input id="sName" placeholder="Sri Lakshmi Home Appliances">
    <label>Tagline</label><input id="sTag" placeholder="Best prices • Free delivery • Easy EMI">
    <label>WhatsApp number (customers chat here)</label><input id="sPhone" placeholder="98765 43210" inputmode="tel">
    <label>Address (shown on shared links)</label><input id="sAddr" placeholder="Main Road, Your City">
    <div class="actions">
      <button class="ghost" id="btnExport">⬇ Backup</button>
      <button class="ghost" id="btnImport">⬆ Restore</button>
      <input type="file" id="impFile" accept=".json" class="hide">
    </div>
    <div class="actions">
      <button class="ghost" id="setClose">Close</button>
      <button id="setSave">Save</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CATS = [['📺','TV'],['🧊','Fridge'],['🧺','Washing Machine'],['❄️','AC'],['🍳','Kitchen'],['🔌','Small Appliances'],['🏠','Other']];
const icon = c => (CATS.find(x => x[1] === c) || ['🏠'])[0];
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const priceHtml = (n, big) => `<span class="price ${big ? 'big' : ''}"><span class="sym">₹</span><span class="whole">${Number(n).toLocaleString('en-IN')}</span></span>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const off = p => p.mrp > p.price ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
const feats = p => (p.details || '').split('\n').map(s => s.trim()).filter(Boolean);

/* ---------- storage ---------- */
let db = JSON.parse(localStorage.getItem('catalogue') || 'null') || { shop: { name: '', tag: '', phone: '', addr: '' }, items: [] };
const save = () => { try { localStorage.setItem('catalogue', JSON.stringify(db)); } catch { toast('Storage full! Delete a few items.'); } };
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2400); }

/* ---------- list ---------- */
let curCat = 'All';
$('#catSel').innerHTML = ['All', ...CATS.map(c => c[1])].map(c => `<option value="${c}">${c === 'All' ? 'All' : c}</option>`).join('');
function setCat(c) { curCat = c; $('#catSel').value = c; renderChips(); renderGrid(); }
$('#catSel').onchange = e => setCat(e.target.value);

function renderChips() {
  const all = ['All', ...CATS.map(c => c[1])];
  $('#chips').innerHTML = all.map(c => {
    const n = c === 'All' ? db.items.length : db.items.filter(p => p.cat === c).length;
    return `<button class="${c === curCat ? 'on' : ''}" data-c="${c}">${c === 'All' ? '☰ All' : c} (${n})</button>`;
  }).join('');
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => setCat(b.dataset.c));
}
function renderHeader() {
  $('#shopTitle').textContent = db.shop.name || 'My Showroom';
  $('#shopSub').textContent = db.shop.tag || 'Product catalogue';
}
function filtered() {
  const q = $('#search').value.toLowerCase().trim(), s = $('#sort').value;
  const dm = +document.querySelector('input[name=disc]:checked').value, pmin = +$('#pmin').value || 0, pmax = +$('#pmax').value || 0;
  let list = db.items.filter(p => (curCat === 'All' || p.cat === curCat) &&
    (p.name + ' ' + p.brand + ' ' + (p.model || '')).toLowerCase().includes(q) &&
    (!$('#onlyStock').checked || p.stock !== false) && (!$('#onlyStar').checked || p.star) &&
    off(p) >= dm && p.price >= pmin && (!pmax || p.price <= pmax));
  if (s === 'low') list.sort((a, b) => a.price - b.price);
  else if (s === 'high') list.sort((a, b) => b.price - a.price);
  else if (s === 'disc') list.sort((a, b) => off(b) - off(a));
  else if (s === 'recent') list.sort((a, b) => b.id - a.id);
  else list.sort((a, b) => (b.star ? 1 : 0) - (a.star ? 1 : 0) || b.id - a.id);
  return list;
}
function renderGrid() {
  renderHeader();
  const list = filtered();
  $('#countTxt').textContent = list.length + (list.length === 1 ? ' result' : ' results');
  $('#btnShareAll').classList.toggle('hide', !list.length);
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty"><div class="big">🛒</div><h3>${db.items.length ? 'No results found' : 'Your catalogue is empty'}</h3><p>${db.items.length ? 'Try different keywords or clear the filters.' : 'Click “＋ Add product” to list your first item.'}</p>${db.items.length ? '' : '<button id="btnDemo">Load 3 sample products</button>'}</div>`;
    const d = $('#btnDemo'); if (d) d.onclick = loadDemo;
    return;
  }
  $('#grid').innerHTML = list.map(p => `
    <div class="pcard" data-id="${p.id}">
      <div class="badges">${p.star ? '<span class="best">Best seller</span>' : ''}${off(p) >= 30 ? '<span class="deal">Limited time deal</span>' : ''}</div>
      <div class="pimg ${p.img ? '' : 'ph'}">${p.img ? `<img src="${p.img}" alt="">` : icon(p.cat)}</div>
      <div class="pbody">
        <div class="ttl">${esc(p.name)}</div>
        <div class="bm">${esc(p.brand)}${p.model ? ' · ' + esc(p.model) : ''}</div>
        <div>${off(p) ? `<span class="off">-${off(p)}%</span> ` : ''}${priceHtml(p.price)}</div>
        ${p.mrp > p.price ? `<div class="mrp">M.R.P.: <s>${inr(p.mrp)}</s></div>` : ''}
        <div class="stock ${p.stock === false ? 'out' : 'in'}">${p.stock === false ? 'Currently unavailable' : 'In stock'}</div>
        <div class="cact"><button data-q="${p.id}">Share on WhatsApp</button><button class="link" data-s="${p.id}">${p.star ? '★' : '☆'}</button></div>
      </div>
    </div>`).join('');
  $('#grid').querySelectorAll('.pcard').forEach(c => c.onclick = () => openView(+c.dataset.id));
  $('#grid').querySelectorAll('[data-q]').forEach(b => b.onclick = e => { e.stopPropagation(); shareLink(db.items.find(p => p.id === +b.dataset.q)); });
  $('#grid').querySelectorAll('[data-s]').forEach(b => b.onclick = e => { e.stopPropagation(); const p = db.items.find(p => p.id === +b.dataset.s); p.star = !p.star; save(); renderGrid(); });
}
['#search', '#sort', '#onlyStock', '#onlyStar', '#pmin', '#pmax'].forEach(s => { $(s).oninput = renderGrid; $(s).onchange = renderGrid; });
document.querySelectorAll('input[name=disc]').forEach(r => r.onchange = renderGrid);
$('#goSearch').onclick = () => { renderGrid(); $('#results').scrollIntoView({ behavior: 'smooth' }); };
$('#search').onkeydown = e => { if (e.key === 'Enter') $('#goSearch').click(); };
$('#clearF').onclick = () => {
  $('#search').value = ''; $('#onlyStock').checked = false; $('#onlyStar').checked = false; $('#pmin').value = ''; $('#pmax').value = '';
  document.querySelector('input[name=disc][value="0"]').checked = true; setCat('All');
};

function loadDemo() {
  const t = Date.now();
  db.items.push(
    { id: t + 1, name: '1.5 Ton 5 Star Inverter Split AC', brand: 'Voltas', model: '185V', cat: 'AC', price: 32990, mrp: 52990, warranty: '5 yr compressor', details: 'Copper condenser\nTurbo cooling\nFree standard installation', stock: true, star: true, img: '' },
    { id: t + 2, name: '55" 4K Ultra HD Smart LED TV', brand: 'Samsung', model: 'UA55', cat: 'TV',
